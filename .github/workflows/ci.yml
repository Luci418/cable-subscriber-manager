name: CI

# Gate for every change. Vercel is configured to only promote a commit to
# Production when these checks pass (Settings -> Git -> "Require CI checks").
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (financial logic, provider sync, ID generation)
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build-time only; real values come from Vercel. Any non-empty
          # string is enough to prove the bundle compiles.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          VITE_SUPABASE_PROJECT_ID: ci-placeholder

  database:
    name: Database migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Verify migrations apply cleanly from scratch
        run: supabase db reset --no-seed

      - name: Install pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: Run pgTAP suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pg_prove -v test/db/*.sql
